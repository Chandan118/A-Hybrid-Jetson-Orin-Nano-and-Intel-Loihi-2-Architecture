# Experiment Configuration
#
# ############################################################################
# #  THIS CONFIGURATION DESCRIBES THE SYNTHETIC EXPERIMENTS.               #
# #  It is NOT the configuration of the measurements in exp_rev1/.          #
# #                                                                          #
# #  The scripts under src/ read this file and produce their results from  #
# #  np.random -- they never read the Jetson power rails, the INA3221,      #
# #  tegrastats, or any external meter.  Every figure the config drives    #
# #  (the 50 trials, the 30-minute durations, the 4.5-hour stress test,    #
# #  the 20 battery cycles) is therefore an aspiration or a simulation,    #
# #  not a measurement.                                                     #
# #                                                                          #
# #  The measured configuration is in exp_rev1/ and the measured results   #
# #  are in exp_rev1/results/.  See exp_rev1/results/provenance_audit.json #
# #  and exp_rev1/results/REVIEW_RESPONSE.md.                              #
# #                                                                          #
# #  This file is kept unchanged on purpose: it is the evidence for the    #
# #  provenance finding.                                                     #
# ############################################################################


# Incremental Map Compression
compression:
  max_memory_gb: 6.8
  compression_threshold: 0.85
  num_trials: 50
  duration_minutes: 30
  environments:
    - name: "Dense Forest"
      keypoints: 500
      movement: 0.5
    - name: "Cluttered Indoor"
      keypoints: 400
      movement: 0.7
    - name: "Open Field"
      keypoints: 150
      movement: 1.2

# Standard Benchmark
benchmark:
  datasets:
    - EuRoC_MAV
    - KITTI
  num_runs: 5
  max_keypoints: 2000
  feature_threshold: 0.01

# Performance Metrics
metrics:
  collection_interval: 1.0  # seconds
  power_samples_per_trial: 1000
  memory_samples_per_trial: 1000

# Endurance Stress Test
stress_test:
  duration_hours: 4.5
  battery_cycles: 20
  thermal_limit_cpu: 85  # Celsius
  thermal_limit_gpu: 80  # Celsius

# Physical Tests
physical_tests:
  num_trials: 50
  duration_minutes: 30
  sample_interval: 1.0  # seconds
